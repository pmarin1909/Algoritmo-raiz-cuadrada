<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolutor de Raíces Cuadradas con Colores</title>
    <style>
        :root {
            --azul-oscuro: #2c3e50;
            --azul-claro: #3498db;
            --fondo: #f4f6f9;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--fondo);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controles {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        input {
            font-size: 2rem;
            padding: 0.5rem;
            width: 250px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-family: monospace;
        }
        button {
            font-size: 1.2rem;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: var(--azul-oscuro);
            color: white;
            transition: background 0.2s;
            font-weight: bold;
        }
        button:hover { background-color: #1a252f; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        
        .layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }
        
        .pizarra {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: flex;
            min-width: 450px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5rem;
            line-height: 1.2;
        }
        
        .zona-izq { display: flex; }
        .simbolo-raiz {
            font-size: 2.5rem;
            margin-top: -0.2rem;
            margin-right: 0.2rem;
            color: var(--azul-oscuro);
        }
        .col-izq {
            text-align: right;
            white-space: pre; /* Vital para mantener los espacios de alineación */
            padding-right: 1.5rem;
        }
        
        .col-der {
            border-left: 4px solid var(--azul-oscuro);
            padding-left: 1.5rem;
            display: flex;
            flex-direction: column;
            min-width: 280px;
        }
        .caja-raiz {
            border-bottom: 4px solid var(--azul-oscuro);
            padding-bottom: 0.5rem;
            min-height: 3rem;
            color: var(--azul-oscuro);
            font-weight: bold;
            letter-spacing: 0.2rem;
            white-space: nowrap;
        }
        .caja-aux {
            margin-top: 1rem;
            font-size: 1.8rem;
            color: #555;
            white-space: pre-line;
        }
        
        .caja-explicacion {
            width: 350px;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            border-left: 6px solid var(--azul-claro);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-size: 1.4rem;
            line-height: 1.5;
        }
        .caja-explicacion h3 { margin-top: 0; color: var(--azul-oscuro); }

        /* Clases de resaltado semántico */
        .hl-resta { color: #e74c3c; } /* Rojo */
        .hl-nuevo { color: #27ae60; } /* Verde */
        .hl-bajada { color: #2980b9; } /* Azul */
        .hl-raiz { color: #e67e22; } /* Naranja */
        .hl-cifra { color: #8e44ad; } /* Morado */
        .flecha { color: #e67e22; font-size: 1.8rem; vertical-align: middle; margin-left: 10px; }
        
    </style>
</head>
<body>

    <h1>Resolutor Visual con Códigos de Color</h1>
    
    <div class="controles">
        <label style="font-size: 2.5rem;">√</label>
        <input type="text" id="numeroInput" placeholder="Ej: 53421" autocomplete="off">
        <button onclick="iniciar()">Calcular Pasos</button>
        <button id="btnAnt" onclick="cambiarPaso(-1)" disabled>◀ Atrás</button>
        <button id="btnSig" onclick="cambiarPaso(1)" disabled>Siguiente ▶</button>
    </div>

    <div class="layout" id="zonaResolucion" style="visibility: hidden;">
        <div class="pizarra">
            <div class="zona-izq">
                <div class="simbolo-raiz">√</div>
                <div class="col-izq" id="htmlIzq"></div>
            </div>
            <div class="col-der">
                <div class="caja-raiz" id="htmlRaiz"></div>
                <div class="caja-aux" id="htmlAux"></div>
            </div>
        </div>
        
        <div class="caja-explicacion">
            <h3 id="expTitulo">Paso 0</h3>
            <div id="expTexto"></div>
        </div>
    </div>

    <script>
        let estados = [];
        let pasoActual = 0;

        function iniciar() {
            const inputVal = document.getElementById('numeroInput').value.replace(/\D/g, '');
            if (!inputVal) return alert("Introduce un número válido");

            let str = inputVal;
            let grupos = [];
            if(str.length % 2 !== 0) {
                grupos.push(str.substring(0, 1));
                str = str.substring(1);
            }
            for(let i=0; i<str.length; i+=2){
                grupos.push(str.substring(i, i+2));
            }

            generarEstados(grupos);
            
            pasoActual = 0;
            document.getElementById('zonaResolucion').style.visibility = 'visible';
            renderizarEstado();
        }

        function generarEstados(grupos) {
            estados = [];
            let totalGrupos = grupos.length;
            
            // Variables base que acumulan la historia consolidada sin colores temporales
            let izqBase = grupos.join(".") + "\n"; 
            let rootText = "";
            let auxBase = "";
            let remainder = 0;
            let strRemainder = ""; 

            estados.push({
                izq: izqBase, raiz: rootText, aux: auxBase,
                titulo: "Separar en periodos",
                texto: `Empezando desde la derecha, separamos el número en grupos de dos cifras: <b>${grupos.join(".")}</b>.`
            });

            for(let i=0; i<totalGrupos; i++) {
                // Cálculo de relleno para alineación perfecta a la derecha
                let pendingStr = "";
                for(let j=i+1; j<totalGrupos; j++) pendingStr += grupos[j];
                let paddingRight = " ".repeat(pendingStr.length);

                let currentGroup = grupos[i];
                
                // Unimos el resto anterior con el nuevo grupo bajado
                if (i === 0) {
                    strRemainder = currentGroup;
                } else {
                    strRemainder = remainder.toString() + currentGroup;
                }
                remainder = parseInt(strRemainder);
                let currValStr = strRemainder;

                if (i > 0) {
                    // Resaltamos de color azul lo que acabamos de bajar
                    let baseResto = remainder.toString().slice(0, -2);
                    if(remainder.toString() !== strRemainder) {
                       // Caso de 0 a la izquierda
                       baseResto = strRemainder.slice(0, -2);
                    }
                    
                    let lineaBajada = baseResto + `<span class="hl-bajada">${currentGroup}</span>` + paddingRight + "\n";
                    
                    estados.push({
                        izq: izqBase + lineaBajada, raiz: rootText, aux: auxBase,
                        titulo: "Bajar el siguiente grupo",
                        texto: `Bajamos el siguiente par de cifras (<b class="hl-bajada">${currentGroup}</b>) y lo colocamos junto al resto.<br><br>Ahora operamos con el <b>${currValStr}</b>.`
                    });
                    izqBase += currValStr + paddingRight + "\n";
                }

                let bestX = 0, bestProd = 0, base = 0;
                let isFirst = (i === 0);

                if (isFirst) {
                    for(let x=0; x<=9; x++) {
                        if (x*x <= remainder) { bestX = x; bestProd = x*x; }
                    }
                    let nextX = bestX + 1;
                    
                    estados.push({
                        izq: izqBase, raiz: `<span class="hl-nuevo">${bestX}</span>`, aux: auxBase,
                        titulo: "Buscar primera cifra",
                        texto: `Buscamos la cifra más alta que multiplicada por sí misma se acerque a ${currValStr} sin pasarse.<br><br>Elegimos el <b class="hl-nuevo">${bestX}</b> porque ${bestX}² = ${bestProd}. (El ${nextX} se pasaría).`
                    });
                } else {
                    let rootInt = parseInt(rootText);
                    base = rootInt * 2;
                    
                    let auxActivo = `<span class="hl-raiz">${base}</span>_ × _ = ?`;
                    let auxPaso1 = auxBase + (auxBase ? "\n\n" : "") + auxActivo;
                    let raizMoviendose = `<span class="hl-raiz">${rootText}</span><span class="flecha">×2 ➔</span>`;
                    
                    estados.push({
                        izq: izqBase, raiz: raizMoviendose, aux: auxPaso1,
                        titulo: "Duplicar la raíz",
                        texto: `Multiplicamos por dos todo lo que llevamos en la raíz (<b class="hl-raiz">${rootInt} × 2 = ${base}</b>) y lo bajamos a la zona de operaciones.`
                    });

                    for(let x=0; x<=9; x++) {
                        let testProd = (base * 10 + x) * x;
                        if (testProd <= remainder) { bestX = x; bestProd = testProd; }
                    }
                    
                    let auxResuelto = `${base}<span class="hl-cifra">${bestX}</span> × <span class="hl-cifra">${bestX}</span> = ${bestProd}`;
                    let auxPaso2 = auxBase + (auxBase ? "\n\n" : "") + auxResuelto;
                    
                    estados.push({
                        izq: izqBase, raiz: rootText, aux: auxPaso2,
                        titulo: "Probar la cifra de relleno",
                        texto: `Buscamos una cifra (<b class="hl-cifra">${bestX}</b>) para rellenar los huecos y que no se pase de ${currValStr}.<br><br>${base}<b class="hl-cifra">${bestX}</b> × <b class="hl-cifra">${bestX}</b> = <b>${bestProd}</b>.`
                    });
                    
                    auxBase += (auxBase ? "\n\n" : "") + `${base}${bestX} × ${bestX} = ${bestProd}`;
                }

                // Aplicar la resta
                let rawSubStr = "-" + bestProd.toString();
                let subLine = `<span class="hl-resta">${rawSubStr}</span>` + paddingRight + "\n";
                let maxLen = Math.max(currValStr.length, rawSubStr.length);
                let dashLine = "-".repeat(maxLen) + paddingRight + "\n";
                
                izqBase += subLine + dashLine;
                remainder = remainder - bestProd;
                
                let finalRest = remainder === 0 ? "0" : remainder.toString();
                if(remainder === 0 && i !== totalGrupos - 1) {
                    finalRest = "0"; // Mantenemos el 0 para juntarlo en el paso siguiente
                }

                estados.push({
                    izq: izqBase + finalRest + paddingRight + "\n", 
                    raiz: rootText + `<span class="hl-nuevo">${bestX}</span>`, 
                    aux: auxBase,
                    titulo: "Restar y subir a la raíz",
                    texto: `Restamos <b class="hl-resta">${bestProd}</b> a ${currValStr} y nos queda de resto ${remainder}.<br><br>Subimos la cifra definitiva (<b class="hl-nuevo">${bestX}</b>) a la caja de la raíz.`
                });
                
                rootText += bestX.toString();
                if (i === totalGrupos - 1) { izqBase += finalRest + "\n"; }
            }

            estados.push({
                izq: izqBase, raiz: rootText, aux: auxBase,
                titulo: "¡Raíz calculada!",
                texto: `El algoritmo con números enteros ha terminado.<br><br>La raíz es <b>${rootText}</b> y el resto final es <b>${remainder}</b>.`
            });
        }

        function cambiarPaso(dir) {
            pasoActual += dir;
            renderizarEstado();
        }

        function renderizarEstado() {
            let estado = estados[pasoActual];
            
            document.getElementById('htmlIzq').innerHTML = estado.izq;
            document.getElementById('htmlRaiz').innerHTML = estado.raiz;
            document.getElementById('htmlAux').innerHTML = estado.aux;
            
            document.getElementById('expTitulo').textContent = estado.titulo;
            document.getElementById('expTexto').innerHTML = estado.texto;

            document.getElementById('btnAnt').disabled = (pasoActual === 0);
            document.getElementById('btnSig').disabled = (pasoActual === estados.length - 1);
        }
    </script>
</body>
</html>
